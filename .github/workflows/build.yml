name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Load signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/shortslock.p12
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/shortslock.p12" >> $GITHUB_ENV
          echo "SIGNING_PASSWORD=${{ secrets.SIGNING_PASSWORD }}" >> $GITHUB_ENV
      - run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Build signed release
        if: env.HAS_KEY == 'true'
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shortslock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: shortslock-release-apk
          path: app/build/outputs/apk/release/app-release.apk
